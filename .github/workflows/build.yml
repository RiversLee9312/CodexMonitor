name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run MSTest core tests
        shell: pwsh
        run: ./scripts/Test.ps1
      - name: Build Release and MSI
        shell: pwsh
        run: ./scripts/Build-Installer.ps1
      - name: Validate published executable
        shell: pwsh
        run: ./scripts/Test.ps1 -IncludeRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-x64
          path: |
            artifacts/installer/*.msi
            artifacts/installer/*.sha256
            artifacts/test-results/*.trx
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release-artifacts
      - name: Publish verified installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          msi="$(find release-artifacts -type f -name "CodexMonitor-${version}-win-x64.msi" -print -quit)"
          test -n "$msi"
          test -f "${msi}.sha256"
          (cd "$(dirname "$msi")" && sha256sum --check "$(basename "$msi").sha256")
          gh release create "$GITHUB_REF_NAME" "$msi" "${msi}.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Codex Monitor ${version}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
